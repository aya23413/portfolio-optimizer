<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OptiFolio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <a href="{{ url_for('main.index') }}">OptiFolio</a>
                <span class="sidebar-tagline">Optimisation de portefeuille</span>
            </div>
            <nav class="sidebar-nav">
                <a class="sidebar-link {% if request.endpoint == 'main.index' %}active{% endif %}"
                   href="{{ url_for('main.index') }}">Accueil</a>
                <a class="sidebar-link {% if request.endpoint == 'main.data' %}active{% endif %}"
                   href="{{ url_for('main.data') }}">Données</a>
                <a class="sidebar-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}"
                   href="{{ url_for('main.dashboard') }}">Optimisation</a>
            </nav>
        </aside>

        <div class="main-area">
            <main class="main-content {% block main_class %}{% endblock %}">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
